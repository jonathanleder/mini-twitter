# Configuracion de test: sin spring.data.mongodb.uri/host, por lo que
# Spring Boot autoconfigura un mongod embebido (de.flapdoodle.embed.mongo.spring3x)
# para cada ejecucion de tests, sin depender de un Mongo real corriendo.
de.flapdoodle.mongodb.embedded.version=7.0.4

logging.level.org.springframework.boot=INFO
